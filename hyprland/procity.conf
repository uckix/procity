# PROCity — optional Hyprland window rules (legacy hyprlang .conf configs).
# For Lua-based configs (current Omarchy), use procity.lua instead.
#
# Do NOT add this automatically. To use it, copy the lines below into
# ~/.config/hypr/hyprland.conf (or an include in ~/.config/hypr/conf/).
# The app window's title is "PROCity".

# Dedicated floating window, nearly fullscreen:
windowrule = float, title:^(PROCity)$
windowrule = size 92% 92%, title:^(PROCity)$
windowrule = center, title:^(PROCity)$
windowrule = workspace special:procity, title:^(PROCity)$

# Or, for a true fullscreen kiosk-style window instead, comment the rules
# above and uncomment this one:
# windowrule = fullscreen, title:^(PROCity)$
